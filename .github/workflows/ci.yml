name: CI - Continuous Integration

on:
  push:
    branches: [ main, master, develop ]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [ main, master, develop ]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - '.github/workflows/ci.yml'
  workflow_dispatch:

jobs:
  # ==========================================
  # 1. BACKEND CI (Java 21 + Spring Boot 3.2)
  # ==========================================
  backend-ci:
    name: Backend Test & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Run Maven Unit & Service Tests
        run: mvn clean test -B

      - name: Build JAR Package (Verify Compile & Packaging)
        run: mvn package -DskipTests -B

      - name: Upload Backend Test Report (if failed)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-test-reports
          path: backend/target/surefire-reports/
          retention-days: 7

  # ==========================================
  # 2. FRONTEND CI (Node.js 20 + React/Vite)
  # ==========================================
  frontend-ci:
    name: Frontend Lint & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Run ESLint Check
        run: npm run lint
        continue-on-error: true # Báo warning nếu có lỗi lint nhưng không chặn pipeline

      - name: Run TypeScript Check & Vite Build
        run: npm run build

  # ==========================================
  # 3. DOCKER BUILD DRY RUN
  # ==========================================
  docker-ci:
    name: Docker Build Validation
    runs-on: ubuntu-latest
    needs: [backend-ci, frontend-ci]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate Backend Dockerfile
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/dockerfile
          push: false
          tags: system-internal/backend:test

      - name: Validate Frontend Dockerfile
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          tags: system-internal/frontend:test

      - name: Validate Face AI Service Dockerfile
        uses: docker/build-push-action@v5
        with:
          context: ./backend/face_ai_service
          file: ./backend/face_ai_service/Dockerfile
          push: false
          tags: system-internal/face-ai:test
