services:
  backend:
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      SERVER_SSL_ENABLED: ${SERVER_SSL_ENABLED:-false}
      APP_REQUIRE_HTTPS: ${APP_REQUIRE_HTTPS:-false}
      APP_HTTP_REDIRECT_ENABLED: ${APP_HTTP_REDIRECT_ENABLED:-false}
      REDIS_PASSWORD: ${PROD_REDIS_PASSWORD:-${REDIS_PASSWORD:-}}
    restart: always

  frontend:
    restart: always

  postgres:
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - /mnt/storage/postgres_data:/var/lib/postgresql/data
    restart: always

  redis:
    restart: always
    command: >
      sh -c 'if [ -n "$${PROD_REDIS_PASSWORD:-$${REDIS_PASSWORD:-}}" ]; then
        exec redis-server --requirepass "$${PROD_REDIS_PASSWORD:-$${REDIS_PASSWORD}}";
      else
        exec redis-server;
      fi'

  minio:
    environment:
      MINIO_ROOT_USER: ${MINIO_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD}
    volumes:
      - /mnt/storage/minio_data:/data
    command: server /data --address ":9000" --console-address ":9001"
    restart: always

  face-ai:
    volumes:
      - /mnt/storage/face_ai_models:/models
    restart: always
