name: system_internal_likenew
description: "A new Flutter project."
publish_to: 'none'

version: 1.1.21+21

environment:
  sdk: ^3.11.5


dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^3.0.0
  firebase_messaging: ^15.0.0
  flutter_local_notifications: ^19.0.0
  flutter_secure_storage: ^9.2.2

  cupertino_icons: ^1.0.8

  # State management
  provider: ^6.1.2

  # Navigation
  go_router: ^14.6.2

  # UI & Animations
  flutter_animate: ^4.5.0
  shimmer: ^3.0.0

  # Charts
  fl_chart: ^0.69.2

  # Icons
  lucide_icons_flutter: ^3.1.14

  # QR Code
  qr_flutter: ^4.1.0
  mobile_scanner: ^5.2.3
  camera: ^0.11.0+2
  google_mlkit_face_detection: ^0.13.2
  tflite_flutter: ^0.11.0
  sqflite: ^2.4.1
  path: ^1.9.1

  # App Info
  package_info_plus: ^8.3.0

  # Utils
  intl: ^0.19.0
  http: ^1.2.2
  image: ^4.8.0
  google_fonts: ^8.1.0
  image_picker: ^1.2.2
  file_picker: ^10.3.10
  url_launcher: ^6.3.2
  stomp_dart_client: ^3.0.1
  video_player: ^2.11.1
  path_provider: ^2.1.2
  open_filex: ^4.7.0
  share_plus: ^12.0.2
  pdf: ^3.12.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: "^0.13.1"
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/models/
    - assets/model/

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/icon.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/icon.png"



