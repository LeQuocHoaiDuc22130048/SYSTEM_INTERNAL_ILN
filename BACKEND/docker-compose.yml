name: si_backend

services:
  backend:
    build:
      context: .
      dockerfile: dockerfile
    container_name: SI_backend_app
    env_file:
      - .env
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      SERVER_ADDRESS: 0.0.0.0
      DB_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-system_internal_db}
      DB_USERNAME: ${DB_USERNAME:-admin}
      DB_PASSWORD: ${DB_PASSWORD:-admin}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      MINIO_ENDPOINT: http://minio:9000
      FACE_RECOGNITION_BASE_URL: http://face-ai:5000
    ports:
      - "8080:8080"
    volumes:
      - ./firebase-service-account.json:/app/firebase-service-account.json:ro
    depends_on:
      - postgres
      - redis
      - minio
      - face-ai
    restart: unless-stopped

  postgres:
    image: pgvector/pgvector:pg15
    container_name: SI_postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-system_internal_db}
      POSTGRES_USER: ${DB_USERNAME:-admin}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-admin}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:alpine
    container_name: redis_cache
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

  minio:
    image: quay.io/minio/minio:latest
    container_name: minio_storage
    environment:
      MINIO_ROOT_USER: ${MINIO_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    command: server /data --address ":9000" --console-address ":9001"
    restart: unless-stopped

  face-ai:
    build:
      context: ./face_ai_service
      dockerfile: Dockerfile
    container_name: SI_face_ai
    environment:
      FACE_AI_HOST: 0.0.0.0
      FACE_AI_PORT: 5000
      FACE_AI_MODEL_ROOT: /models
      FACE_AI_MODEL_NAME: buffalo_l
      FACE_AI_MATCH_THRESHOLD: ${ATTENDANCE_FACE_MATCH_THRESHOLD:-0.57}
    ports:
      - "5000:5000"
    volumes:
      - face_ai_models:/models
    restart: unless-stopped

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: SI_frontend_app
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
    external: true
    name: backend_postgres_data
  redis_data:
    external: true
    name: backend_redis_data
  minio_data:
    external: true
    name: backend_minio_data
  face_ai_models:
    external: true
    name: backend_face_ai_models
