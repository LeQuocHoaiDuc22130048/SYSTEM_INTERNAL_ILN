services:
  postgres:
    image: pgvector/pgvector:pg15
    container_name: SI_postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-system_internal_db}
      POSTGRES_USER: ${DB_USERNAME:-admin}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-admin}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:alpine
    container_name: redis_cache
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  minio:
    image: quay.io/minio/minio:latest
    container_name: minio_storage
    environment:
      MINIO_ROOT_USER: ${MINIO_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    command: server /data --address ":9000" --console-address ":9001"

  face-ai:
    build:
      context: ./face_ai_service
      dockerfile: Dockerfile
    container_name: SI_face_ai
    environment:
      FACE_AI_HOST: 0.0.0.0
      FACE_AI_PORT: 5000
      FACE_AI_MODEL_ROOT: /models
      FACE_AI_MODEL_NAME: buffalo_l
      FACE_AI_MATCH_THRESHOLD: ${ATTENDANCE_FACE_MATCH_THRESHOLD:-0.57}
    ports:
      - "5000:5000"
    volumes:
      - face_ai_models:/models
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  minio_data:
  face_ai_models:
