spring:
  application:
    name: system-internal
  profiles:
    active: dev
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    default-property-inclusion: non_null

app:
  face-recognition:
    base-url: ${FACE_RECOGNITION_BASE_URL:http://localhost:5000}
  messaging:
    max-file-size: ${MESSAGE_MAX_FILE_SIZE:52428800}
    minio:
      endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
      access-key: ${MINIO_USER:minioadmin}
      secret-key: ${MINIO_PASSWORD:minioadmin}
      bucket: ${MINIO_MESSAGE_BUCKET:message-media}
  repair:
    max-file-size: ${REPAIR_MEDIA_MAX_FILE_SIZE:52428800}
    minio:
      bucket: ${MINIO_REPAIR_BUCKET:repair-media}
