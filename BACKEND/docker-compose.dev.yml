services:
  postgres:
    image: pgvector/pgvector:pg15
    container_name: SI_postgres
    environment:
      POSTGRES_DB: system_internal_db
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      DATABASE_URL: postgresql://admin:admin@postgres:5432/system_internal_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data

  redis:
    image: redis:alpine
    container_name: redis_cache
    ports:
      - "6379:6379"

  minio:
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: admin123
    volumes:
      - minio_data_dev:/data
    command: server /data --console-address ":9001"

volumes:
  postgres_data_dev:
  minio_data_dev:
